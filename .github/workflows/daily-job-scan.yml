name: Daily Bay Area Filmmaking Job Scan

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/daily-job-scan.yml'
      - 'scripts/**'
  schedule:
    # 8 AM Pacific Daylight Time (UTC-7), approx Mar–Nov
    - cron: '0 15 * * *'
    # 8 AM Pacific Standard Time (UTC-8), approx Nov–Mar
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  job-scan:
    name: Search & Email Job Results
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Prevent the two cron triggers from overlapping; only one runs at a time
    concurrency:
      group: daily-job-scan
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily job scan
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:       ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/daily_job_scan.py
